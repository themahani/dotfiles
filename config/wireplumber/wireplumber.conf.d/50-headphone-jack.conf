# Loads scripts/headphone-jack.lua, linked into ~/.local/share/wireplumber/scripts.
wireplumber.components = [
  {
    name = headphone-jack.lua, type = script/lua
    provides = custom.headphone-jack
    requires = [ metadata.default ]
  }
]

wireplumber.profiles = {
  main = {
    custom.headphone-jack = required
  }
}
