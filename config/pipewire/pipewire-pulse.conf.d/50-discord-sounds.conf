# Discord plays its message sounds through "Chromium" streams, which the shell
# mutes during Do not disturb. Keep WirePlumber from saving that mute and
# restoring it on the next sound once Do not disturb is off.
stream.rules = [
  {
    matches = [
      { application.process.binary = "Discord", application.name = "Chromium" }
    ]
    actions = {
      update-props = { state.restore-props = false }
    }
  }
]
