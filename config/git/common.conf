[alias]
    update-submodules = submodule update --init --recursive
    upgrade-submodules = submodule update --init --remote
    mnf = merge --no-ff

[diff]
    mnemonicPrefix = true
    wordRegex = "[^[:space:]]|([[:alnum:]]|UTF_8_GUARD)+"
    compactionHeuristic = true

[color]
    ui = auto

[color "grep"]
    match = cyan bold
    selected = blue
    context = normal
    filename = magenta
    linenumber = green
    separator = yellow
    function = blue

[pull]
    rebase = false

[init]
    defaultBranch = main
