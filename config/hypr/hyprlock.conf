# Colors: the committed Material fallback, overridden by the wallpaper colors
# matugen generates (config/matugen) once it has run.
source = $HOME/.config/hypr/matugen-fallback.conf
source = $HOME/.local/state/matugen/hyprlock.conf

general {
    hide_cursor = false
    ignore_empty_input = false
    fail_timeout = 500      # half a second
}
background {
    monitor =
    path = $HOME/.wallpapers/.current
    color = $background
    blur_passes = 2
    blue_size = 2
}

auth {
        pam:enabled = true
        fingerprint:enabled = false
}

label {
    monitor =
    text =    $LAYOUT
    color = $subtext
    font_size = 16
    font_family = Ubuntu

    position = 0, -7%
    halign = center
    valign = center
    onclick = hyprctl switchxkblayout at-translated-set-2-keyboard next
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = $primary $tertiary 45deg
    check_color = $tertiary $primary 120deg
    fail_color = $error
    capslock_color = $tertiary

    font_color = $text
    fade_on_empty = false
    # fade_timeout = 1000     # in [ms]
    placeholder_text = <i>Enter Password </i>
    rounding = 15
    dots_spacing = 0.2
    dots_center = true
    hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text =   $DESC
    color = $subtext
    font_size = 25
    font_family = Ubuntu

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] date +'%A, %B %d'
    color = $text
    font_size = 36
    font_family = Ubuntu Bold

    position = 0, -150
    halign = center
    valign = top
}

label {
    monitor = 
    text = $TIME
    font_family = Ubuntu Bold
    font_size = 132
    color = $text
    position = 0, -200
    valign = top
    halign = center
}

# Top bar: matches the quickshell bar (Island/Chip: base fill, blue border,
# Theme.text icons in 36px slots). Shapes render below the labels after them.
shape {
    monitor =
    size = 116, 38
    color = $panel
    rounding = 10
    border_size = 1
    border_color = $primary
    position = -20, -20
    halign = right
    valign = top
}

# Same as the bar's screen off button: the delay keeps the click and settling
# mouse from re-enabling DPMS; any input wakes the outputs again.
label {
    monitor =
    text = 󰶐
    font_family = Ubuntu Nerd Font Bold
    font_size = 14
    color = $text
    position = -104, -28
    valign = top
    halign = right
    onclick = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
}

label {
    monitor =
    text = 󰒲
    font_family = Ubuntu Nerd Font Bold
    font_size = 14
    color = $text
    position = -68, -28
    valign = top
    halign = right
    onclick = systemctl suspend
}

label {
    monitor =
    text = 󰍃
    font_family = Ubuntu Nerd Font Bold
    font_size = 14
    color = $text
    position = -32, -28
    valign = top
    halign = right
    onclick = hyprshutdown
}

label {
    monitor =
    text = cmd[update:1000] bash $HOME/.config/hypr/scripts/battery_status.sh
    font_family = Ubuntu Nerd Font Bold
    font_size = 14
    color = $text
    position = 28, -28
    valign = top
    halign = left
}

