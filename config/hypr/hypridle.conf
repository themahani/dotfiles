general {
    # Quickshell locks on loginctl lock-session and before every suspend by
    # itself (services/Lock.qml), holding suspend until the lock is shown.
    # hypridle locks with hyprlock only when Quickshell isn't running.
    lock_cmd = pgrep -x quickshell >/dev/null || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    inhibit_sleep = 3                           # hold suspend until the session is locked.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 300                                # 5 min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 360                                 # 6 mins
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 360                                                     # 6 mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'     # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r          # screen on when activity is detected after timeout has fired.
}

listener {
    timeout = 1800                                # 30 min
    on-timeout = systemctl suspend                # suspend pc
}
